[project]
name = "zotero-chatgpt-mcp"
version = "0.2.1"
description = "Local Zotero Desktop MCP plugin for ChatGPT with safe read tools and approval-gated writes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.133,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.41,<1",
  "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
