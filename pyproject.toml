[project]
name = "zotero-read-only-mcp-bridge"
version = "1.0.0"
description = "Per-user, read-only MCP bridge for a local Zotero Desktop library"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.133,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.41,<1",
  "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
